name: 🚀 Deploy to AWS EC2 (Self-Hosted)

on:
  push:
    branches:
      - staging-live-project-branch-tbd  # Runs on every push to 'staging-live-project-branch'

jobs:
  deploy:
    runs-on: self-hosted  # Uses EC2 as runner

    steps:
    
    - name: 📥 Checkout Repository
      uses: actions/checkout@v3

    - name: 🛠 Install Dependencies (Backend)
      run: |
        cd /home/ubuntu/project/backend
        git pull origin main
        npm install
        pm2 restart backend || pm2 start server.js --name backend
        pm2 save

    - name: 🛠 Install Dependencies (Frontend)
      run: |
        cd /home/ubuntu/project/frontend
        git pull origin main
        npm install
        npm run build
        pm2 restart frontend || pm2 start npm --name frontend -- start
        pm2 save

    - name: 🔄 Restart Nginx
      run: sudo systemctl restart nginx
