name: 🚀 Deploy to AWS EC2 (Self-Hosted)

on:
  push:
    branches:
      - feature-2admin-3normalmember-tbd  # Runs on every push to 'feature-2admin-3normalmember.'

jobs:
  deploy:
    runs-on: self-hosted  # Uses EC2 as runner

    steps:
    
    - name: 📥 Checkout Repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GH_TOKEN }}  # Uses PAT from GitHub Secrets

    - name: 🛠 Configure Git Authentication
      run: |
        git config --global user.email "janjirala.KiranKumar@itth.co.uk"
        git config --global user.name "kiran-kumar"
        git config --global credential.helper store
        echo "https://x-access-token:${{ secrets.GH_TOKEN }}@github.com" > ~/.git-credentials
        chmod 600 ~/.git-credentials

    - name: 🛠 Install Dependencies (Backend)
      run: |
        cd /home/ubuntu/website_team/tasklearn-backend
        git pull origin feature-2admin-3normalmember
        npm install
        pm2 restart backend || pm2 start server.js --name backend
        pm2 save

    - name: 🛠 Install Dependencies (Frontend)
      run: |
        cd /home/ubuntu/website_team/tasklearn_frontend
        git pull origin feature-2admin-3normalmember
        npm install
        npm run build
        pm2 restart frontend || pm2 start npm --name frontend -- start
        pm2 save

    - name: 🔄 Restart Nginx
      run: sudo systemctl restart nginx
